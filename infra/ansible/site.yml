- name: VM de Compose (producción actual)
  hosts: platform-vm
  become: true

  vars:
    runner_user: runner
    deploy_dir: /opt/dora

  tasks:
    - name: Configuración base común
      ansible.builtin.import_tasks: tasks/base.yml

    # ---------- Docker (repositorio oficial) ----------
    - name: Llave GPG de Docker
      ansible.builtin.get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Repositorio de Docker
      ansible.builtin.deb822_repository:
        name: docker
        types: deb
        uris: https://download.docker.com/linux/ubuntu
        suites: "{{ ansible_facts['distribution_release'] }}"   # "noble"
        components: stable
        architectures: amd64
        signed_by: /etc/apt/keyrings/docker.asc

    - name: Docker Engine y plugin de Compose
      ansible.builtin.apt:
        name: [docker-ce, docker-ce-cli, containerd.io, docker-buildx-plugin, docker-compose-plugin]
        state: present
        update_cache: true

    - name: Docker encendido y activo al arrancar
      ansible.builtin.service:
        name: docker
        state: started
        enabled: true

    # ---------- Usuarios ----------
    - name: Administrador en el grupo docker
      ansible.builtin.user:
        name: "{{ admin_user }}"
        groups: [docker]
        append: true

    - name: Usuario del runner (sin sudo, con acceso a Docker)
      ansible.builtin.user:
        name: "{{ runner_user }}"
        groups: [docker]
        append: true
        shell: /bin/bash

    - name: Carpeta de despliegue
      ansible.builtin.file:
        path: "{{ deploy_dir }}"
        state: directory
        owner: "{{ runner_user }}"
        group: "{{ runner_user }}"
        mode: "0750"
