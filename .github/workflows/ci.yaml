name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - name: Clonar el repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Instalar Go
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: app/go.mod
          cache-dependency-path: app/go.sum

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test ./...

  build:  
    name: Build ${{ matrix.component }}
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [api, worker]
    steps:
      - name: Clonar el repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Preparar Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f

      - name: Construir imagen
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8
        with:
          context: app
          build-args: CMD=${{ matrix.component }}
          tags: dora-${{ matrix.component }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          load: true
          push: false
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}

      - name: Escanear vulnerabilidades
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1  # v0.35.0
        with:
          image-ref: dora-${{ matrix.component }}:${{ github.sha }}
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: '1'

      - name: Publicar en GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/dora-${{ matrix.component }}:${{ github.sha }}"

          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          docker tag "dora-${{ matrix.component }}:${{ github.sha }}" "$IMAGE"
          docker push "$IMAGE"

          echo "Publicada: $IMAGE" >> "$GITHUB_STEP_SUMMARY"
  
  deploy:
    name: Deploy a producción
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: [self-hosted, prod]
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      DEPLOY_DIR: /opt/dora
    steps:
      - name: Clonar el repo
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Guardar la versión actual (para rollback)
        run: |
          PREV_TAG=$(grep '^IMAGE_TAG=' "$DEPLOY_DIR/.env" | cut -d= -f2)
          echo "PREV_TAG=$PREV_TAG" >> "$GITHUB_ENV"
          echo "Versión actual: $PREV_TAG"

      - name: Actualizar compose.yaml e IMAGE_TAG
        run: |
          cp compose.yaml "$DEPLOY_DIR/compose.yaml"
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${GITHUB_SHA}/" "$DEPLOY_DIR/.env"

      - name: Descargar imágenes nuevas
        run: docker compose --project-directory "$DEPLOY_DIR" pull api worker

      - name: Levantar la versión nueva
        run: docker compose --project-directory "$DEPLOY_DIR" up -d

      - name: Verificar que la API quedó lista
        run: |
          for i in $(seq 1 30); do
            if curl -fsS localhost:8080/ready; then
              echo; echo "API lista"; exit 0
            fi
            sleep 2
          done
          echo "::error::La API no quedó lista en 60 segundos"
          docker compose --project-directory "$DEPLOY_DIR" logs --tail 50
          exit 1

      - name: Rollback si algo falló
        if: failure()
        run: |
          echo "::error::Despliegue fallido, volviendo a $PREV_TAG"
          sed -i "s/^IMAGE_TAG=.*/IMAGE_TAG=${PREV_TAG}/" "$DEPLOY_DIR/.env"
          docker compose --project-directory "$DEPLOY_DIR" up -d

      - name: Registrar el despliegue en el tracker
        if: always()
        run: |
          STATUS=success
          [ "${{ job.status }}" = "success" ] || STATUS=failed
          TOKEN=$(grep '^API_TOKEN=' "$DEPLOY_DIR/.env" | cut -d= -f2)
          echo "::add-mask::$TOKEN"
          COMMIT_AT=$(git log -1 --format=%cI)
          curl -fsS -X POST localhost:8080/deployments \
            -H "Authorization: Bearer $TOKEN" -H "Content-Type: application/json" \
            -d "{\"service\":\"dora-tracker\",\"version\":\"$GITHUB_SHA\",\"commit_sha\":\"$GITHUB_SHA\",\"commit_at\":\"$COMMIT_AT\",\"status\":\"$STATUS\"}" \
            || echo "::warning::No se pudo registrar el despliegue en el tracker"
  